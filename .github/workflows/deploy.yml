name: Deploy the game to GitHub Pages

# The playable build is published from the repository's own source: there is
# no committed copy of the build output, so the site can never drift from the
# code it was built from.
#
# The published URL is:
#     https://atiffhussainkhan.github.io/SuperCitycon/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a new push cancels the one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install
        working-directory: game
        run: npm ci

      - name: Build
        working-directory: game
        # `npm run build:cleared` is the PUBLISHABLE build: it strips the 2D art,
        # every one of whose records carries `licence_status: "unverified"` and
        # none of which has been cleared for public release (see
        # game/LICENCE-REPORT.md). The plain `npm run build` is the LOCAL build:
        # it keeps that art and writes `dist/DO-NOT-PUBLISH.txt` into its own
        # output. Publishing that one would ship 82 uncleared images and a
        # notice saying not to publish it — which is exactly what the live site
        # was serving until this line was corrected.
        #
        # The build FAILS if the bundle it produces references a file that is
        # not on disk, so a broken site cannot ship.
        run: npm run build:cleared

      - name: Check the bundle
        working-directory: game
        run: |
          test -f dist/index.html
          test -d dist/assets/models
          # The publishable bundle must not carry the uncleared 2D art, and
          # must not carry the notice that says the bundle must not be published.
          test ! -d dist/assets/ui
          test ! -f dist/assets/ui-assets.json
          test ! -f dist/DO-NOT-PUBLISH.txt
          echo "bundle: $(find dist -type f | wc -l) files"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
