name: Deploy the game to GitHub Pages

# The playable build is published from the repository's own source: there is
# no committed copy of the build output, so the site can never drift from the
# code it was built from.
#
# The published URL is:
#     https://atiffhussainkhan.github.io/SuperCitycon/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a new push cancels the one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install
        working-directory: game
        run: npm ci

      - name: Build
        working-directory: game
        # `npm run build` is the LOCAL build: it carries the curated 2D art
        # and writes its own licence status (dist/LICENCE-STATUS.md and
        # dist/DO-NOT-PUBLISH.txt). The build FAILS if the bundle it produces
        # references a file that is not on disk, so a broken site cannot ship.
        run: npm run build

      - name: Check the bundle
        working-directory: game
        run: |
          test -f dist/index.html
          test -d dist/assets/models
          echo "bundle: $(find dist -type f | wc -l) files"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
